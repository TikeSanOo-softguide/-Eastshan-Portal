services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: eastshan-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-eastshan}
      DB_USERNAME: ${DB_USERNAME:-eastshan}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eastshan

  nginx:
    image: nginx:1.27-alpine
    container_name: eastshan-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - eastshan

  mysql:
    image: mysql:8.4
    container_name: eastshan-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-eastshan}
      MYSQL_USER: ${DB_USERNAME:-eastshan}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - eastshan

  # Optional Vite HMR for local Docker development
  vite:
    image: node:20-bookworm
    container_name: eastshan-vite
    working_dir: /app
    profiles: ["vite"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
    environment:
      VITE_HOST: 0.0.0.0
    networks:
      - eastshan

networks:
  eastshan:
    driver: bridge

volumes:
  mysql_data:
  vendor_data:
